on:
  push:
    branches:
      - postgresql-dialect
  pull_request:
  workflow_dispatch:
name: integration-emulator
permissions:
  contents: read
env:
  GOOGLE_CLOUD_PROJECT: "test-project"
  GOOGLE_CLOUD_INSTANCE: "test-instance"
  GOOGLE_CLOUD_DATABASE: "test-db"
jobs:
  integration-test-emulator:
    runs-on: ubuntu-latest
    # Add a PostgreSQL Docker container and the emulator.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        ports:
          - 5432:5432
        volumes:
          - /pg:/var/run/postgresql
          - /tmp:/tmp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      emulator:
        image: gcr.io/cloud-spanner-emulator/emulator # zizmor: ignore[unpinned-images]
        ports:
          - 9010:9010
          - 9020:9020
    strategy:
      fail-fast: false
      matrix:
        java: [11, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: ${{matrix.java}}
      - run: java -version
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.17.7'
      - run: go version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - name: Setup psql
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
      - name: Create PostgreSQL test database
        run: |
          psql -h /pg -U postgres -c "CREATE DATABASE pgadapter"
      - name: Run integration tests
        run: mvn -Dpgadapter.use_virtual_threads=true -Dpgadapter.test_float4_type=float8 -Dpgadapter.use_virtual_grpc_transport_threads=true verify -B -Dclirr.skip=true -DskipUnits=true -DskipITs=false -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        env:
          POSTGRES_HOST: /pg
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_DATABASE: pgadapter
          SPANNER_EMULATOR_HOST: localhost:9010
          SPANNER_DISABLE_BUILTIN_METRICS: true
