on:
  push:
    branches:
      - postgresql-dialect
  pull_request:
  workflow_dispatch:
name: snippets
permissions:
  contents: read
jobs:
  psql-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install postgresql-client-17"
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --yes --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install postgresql-client-17
      - name: Run psql snippets
        working-directory: ./samples/snippets/psql-snippets/tests
        run: ./test_samples.sh
  java-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 17
      - name: Run Java Snippets
        working-directory: ./samples/snippets/java-snippets
        run: mvn test -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  go-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - name: Run Go snippets
        working-directory: ./samples/snippets/golang-snippets
        run: go test
  python-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python --version
      - name: Install pip
        run: python -m pip install --upgrade pip
      - name: Run Python snippets
        working-directory: ./samples/snippets/python-snippets
        run: |
          pip install -r requirements.txt
          python -m unittest
  nodejs-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node --version
      - name: Run Node.js snippets
        working-directory: ./samples/snippets/nodejs-snippets
        run: |
          npm install
          npm test
  dotnet-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - run: node --version
      - name: Run dotnet snippets
        working-directory: ./samples/snippets/dotnet-snippets
        run: dotnet test
  php-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer
      - run: php --version
      - name: Install dependencies
        working-directory: ./samples/snippets/php-snippets
        run: composer install
      - name: Run PHP snippets
        working-directory: ./samples/snippets/php-snippets/test
        run: ../vendor/bin/phpunit SamplesTest.php
