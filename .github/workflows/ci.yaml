on:
  push:
    branches:
    - postgresql-dialect
  pull_request:
name: ci
permissions:
  contents: read
env:
  GOOGLE_CLOUD_PROJECT: "span-cloud-testing"
  GOOGLE_CLOUD_INSTANCE: "pgadapter-testing"
  GOOGLE_CLOUD_DATABASE: "testdb_e2e_psql"
  GOOGLE_CLOUD_ENDPOINT: "spanner.googleapis.com"
  JSON_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.JSON_SERVICE_ACCOUNT_CREDENTIALS }}
jobs:
  check-env:
    outputs:
      has-key: ${{ steps.project-id.outputs.defined }}
    runs-on: ubuntu-latest
    steps:
      - id: project-id
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        if: "${{ env.GCP_PROJECT_ID != '' }}"
        run: echo "defined=true" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: 21
        distribution: 'zulu'
    - run: java -version
    - name: Check code formatting (root)
      run: mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp
    - name: Check code formatting (benchmarks)
      run: |
        mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp -f benchmarks/tpcc/pom.xml
        mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp -f benchmarks/latency-comparison/java/pom.xml
    - name: Check code formatting (snippets)
      run: mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp -f samples/snippets/java-snippets/pom.xml
    - name: Check code formatting (samples)
      run: |
        mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp -f samples/java/cloud-run/pom.xml
        mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp -f samples/java/hibernate/pom.xml
        mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp -f samples/java/jdbc/pom.xml
        mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp -f samples/java/r2dbc/pom.xml
        mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp -f samples/java/spring-data-jpa/pom.xml
        mvn com.spotify.fmt:fmt-maven-plugin:check -B -ntp -f samples/cloud-run/java/pom.xml
  e2e-psql-v12-v14:
    needs: [check-env]
    if: needs.check-env.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 11
          distribution: 'zulu'
      - run: java -version
      - name: "Install postgresql-client-12"
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --yes --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install postgresql-client-12
      - id: 'auth'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: '${{ secrets.JSON_SERVICE_ACCOUNT_CREDENTIALS }}'
      - id: 'setup-gcloud'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
      - name: "Install gcloud alpha component"
        run: gcloud components install alpha
      - run: .ci/run-with-credentials.sh uber-jar-build
      - run: .ci/run-with-credentials.sh e2e-psql 12 14.1
