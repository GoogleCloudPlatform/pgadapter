[package]
name         = "spanner-pgadapter"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.93.0"

[dependencies]
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt-multi-thread"] }
bytes = "1.11"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
google-cloud-spanner = { path = "/Users/loite/RustroverProjects/google-cloud-rust/src/spanner", features = [
  "connection",
] }
async-trait = "0.1"
serde_json     = "1.0"

[dev-dependencies]
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
mockall        = "0.14"
tokio-stream   = "0.1"
tonic          = "0.14"
tonic-prost    = "0.14"
prost          = "0.14"
prost-types    = "0.14"
base64         = "0.22"
