# Format: //devtools/kokoro/config/proto/build.proto

env_vars: {
  key: "SPANNER_ENV"
  value: "internal_emulator"
}

# Location of the bash script. Should have value <github_scm.name>/<path_from_repository_root>.
build_file: "pgadapter/.kokoro/pg-regress/kokoro_build.sh"

before_action {
  invoke_blaze {
    name: "internal_emulator"
    command: BUILD
    targets: "//third_party/cloud_spanner_emulator/binaries:gateway_main"
    # Add any necessary build flags
    flags: "--compilation_mode=opt"
  }
}

timeout_mins: 1200
container_properties {
  docker_image: "us-central1-docker.pkg.dev/kokoro-container-bakery/kokoro/ubuntu/ubuntu2204/full:current"
}
